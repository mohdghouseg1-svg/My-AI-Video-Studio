
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial;background:#101426;color:white}
.container{max-width:750px;margin:auto;background:#1b2340;padding:22px;border-radius:16px}
h1{text-align:center;color:#65d6ff}
.subtitle{text-align:center;color:#c3c9dc}
textarea{width:100%;min-height:150px;padding:14px;margin:15px 0;border-radius:10px;border:1px solid #536080;background:#11182d;color:white;font-size:16px}
button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:9px;background:#3978f6;color:white;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
.output{background:#11182d;padding:15px;margin-top:15px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
video{width:100%;margin-top:15px;border-radius:10px}
.status{color:#65d6ff;margin-top:12px;overflow-wrap:anywhere}
a{color:#65d6ff}
</style>
</head>
<body>
 hello test
<div class="container">
<h1>🎬 My AI Video Studio</h1>
<p class="subtitle">Create AI Videos With Voiceover</p>
<h3>Enter Your Video Prompt</h3>
<textarea id="prompt" placeholder="Write your story or video prompt here..."></textarea>
<button onclick="createScenePlan()">🎞️ Create Scene Plan</button>
<button onclick="downloadScenePlan()">⬇️ Download Scene Plan</button>
<button onclick="playVoice()">🔊 Play Voice</button>
<button onclick="stopVoice()">⏹ Stop Voice</button>
<h3>Scene Plan</h3>
<div id="sceneOutput" class="output">Your scene plan will appear here.</div>
<button id="generateButton" onclick="generateVideo()">🚀 Generate AI Video</button>
<div id="status" class="status">Ready to create your video.</div>
<div id="videoOutput"></div>
<a id="downloadVideo" style="display:none" download="my-ai-video.mp4">⬇️ Download Video</a>
</div>
<script>
let scenes = [];

function createScenePlan() {
 const prompt = document.getElementById("prompt").value.trim();
 if (!prompt) return alert("Please enter your video prompt.");
 const sentences = prompt.split(/(?<=[.!?।])\s+/).filter(s => s.trim());
 const parts = sentences.length > 1 ? sentences : prompt.split(",").filter(s => s.trim());
 const sceneParts = parts.length ? parts : [prompt];
 scenes = sceneParts.map((part,index) => ({scene:index+1,description:part.trim(),duration:5}));
 document.getElementById("sceneOutput").textContent = scenes.map(s =>
 "Scene "+s.scene+"\nDuration: "+s.duration+" seconds\nDescription: "+s.description
 ).join("\n\n");
 document.getElementById("status").textContent = "Scene Plan created successfully!";
}

function downloadScenePlan() {
 if (!scenes.length) return alert("Please create a Scene Plan first.");
 const text = scenes.map(s => "Scene "+s.scene+"\nDuration: "+s.duration+" seconds\nDescription: "+s.description).join("\n\n");
 const url = URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));
 const link = document.createElement("a");
 link.href=url;
 link.download="My-AI-Video-Scene-Plan.txt";
 link.click();
 URL.revokeObjectURL(url);
}

function playVoice() {
 if (!scenes.length) return alert("Please create a Scene Plan first.");
 if (!("speechSynthesis" in window)) return alert("Voice playback is not supported.");
 stopVoice();
 const speech = new SpeechSynthesisUtterance(scenes.map(s=>s.description).join(". "));
 speech.lang="en-IN";
 speech.rate=.9;
 window.speechSynthesis.speak(speech);
}

function stopVoice() {
 if ("speechSynthesis" in window) window.speechSynthesis.cancel();
}

const WORKER_URL = "";

async function generateVideo() {
 const prompt=document.getElementById("prompt").value.trim();
 if (!prompt) return alert("Please enter your video prompt.");
 if (!scenes.length) return alert("Please create a Scene Plan first.");
 if (!WORKER_URL) return alert("Cloudflare Worker is not connected yet.");

 const button=document.getElementById("generateButton");
 const status=document.getElementById("status");
 button.disabled=true;
 status.textContent="Sending request to AI video server...";

 try {
  const response=await fetch(WORKER_URL.replace(/\/$/,"")+"/api/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({prompt,scenes})
  });
  const data=await response.json();
  if (!response.ok) throw new Error(data.error||"Video request failed.");
  if (!data.videoUrl) throw new Error("Video URL not received from server.");

  const videoUrl=new URL(data.videoUrl,WORKER_URL);
  if (!["https:","http:"].includes(videoUrl.protocol)) throw new Error("Invalid video URL.");

  const video=document.createElement("video");
  video.controls=true;
  video.playsInline=true;
  video.src=videoUrl.href;
  document.getElementById("videoOutput").replaceChildren(video);

  const download=document.getElementById("downloadVideo");
  download.href=videoUrl.href;
  download.style.display="block";
  status.textContent="Your AI video is ready!";
 } catch(error) {
  status.textContent="Error: "+error.message;
 } finally {
  button.disabled=false;
 }
}
</script>
</body>
</html>
